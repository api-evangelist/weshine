aid: weshine
name: Weshine
description: 'Weshine (闪萌, Shanmeng), operated by Beijing Shanqu Information Technology Co., Ltd (北京闪趣信息技术有限公司),
  is a Chinese GIF and animated-sticker (表情) search engine. It offers a business-to-business "Expression API"
  (表情API) with three documented interfaces — a hot/trending interface (热门接口) that returns trending GIFs by
  category refreshed hourly, a real-time search interface (搜索接口) supporting gif/webp/mp4 and multi-dimensional
  ranking, and a "magic image" interface (神配图接口) that semantically matches a phrase to a background GIF and
  composites a caption onto it. The platform reports 800M+ users covered, 300M+ daily searches, and 200M+ animated
  images sent per day, powering social apps, input methods (including its own KK Keyboard), and browsers. API access
  is via business partnership; no public self-serve developer portal, OpenAPI specification, or SDK is published.'
